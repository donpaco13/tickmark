[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tickmark"
version = "1.0.0"
description = "A live checklist for coding agents that don't have one."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.6"
authors = [{ name = "François Hatem" }]
keywords = ["cli", "agents", "todo", "checklist"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/donpaco13/tickmark"
Changelog = "https://github.com/donpaco13/tickmark/blob/main/CHANGELOG.md"

# `tk` stays one file with zero imports beyond the stdlib. `script-files`
# installs it as-is (like the old distutils `scripts=` keyword) instead of
# `project.scripts`, which would require an importable module with an entry
# function — that would mean splitting `tk` into a package. Trade-off: on
# Windows this relies on the .py-less shebang being runnable, same as any
# other raw script; it's untested there. `packages = []` turns off
# setuptools' auto-discovery so it doesn't try to package `packaging/` or
# `.github/` as Python packages.
[tool.setuptools]
script-files = ["tk"]
packages = []

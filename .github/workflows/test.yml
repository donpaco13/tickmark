name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.8", "3.10", "3.12", "3.13"]
        include:
          # tk runs on whatever python the user already has; macOS is the other
          # half of that, and the pty tests exercise a different tty stack.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: run the test suite
        run: python -m unittest discover -s tests -v
